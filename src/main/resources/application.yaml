spring:
  application:
    name: notifications
  profiles:
    # Without an explicit profile the service starts with "local" (application-local.yaml + .env).
    default: local
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # The schema is owned by Flyway (db/migration): Hibernate only checks that the
      # entities match it, and refuses to start if they do not.
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        # A listener exception must never put the message back in the queue forever
        # (a message that always fails would be redelivered in a loop).
        default-requeue-rejected: false
        retry:
          # A failing message is retried in the listener a few times (e.g. database briefly
          # unavailable), then rejected: the broker moves it to the dead letter queue.
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2

notifications:
  messaging:
    # Exchange and routing key on which Tickets publishes TICKETS_ISSUED.
    tickets-exchange: tickets-events
    tickets-issued-routing-key: tickets.issued
    # Owned by Notifications.
    tickets-issued-queue: notifications.tickets-issued
    dead-letter-exchange: notifications.dlx
    tickets-issued-dlq: notifications.tickets-issued.dlq
  health:
    # Time limit of each check of GET /api/v1/health (database, broker): a dependency that
    # does not answer in time counts as down, so the endpoint answers 503 quickly.
    check-timeout: 2s
  email:
    # How emails leave the service: "log" writes them to the log (development).
    # A real SMTP sender (e.g. Mailpit) will be selected here.
    sender: log
    dispatch:
      scheduler:
        enabled: true
        # Pause between the end of a run of the sending job and the start of the next one.
        poll-interval-ms: 5000
      # Emails sent at most per run.
      batch-size: 20
      # Attempts per email (the first included); waits 30s, 1m, 2m, 4m; then FAILED.
      max-attempts: 5
      initial-backoff: 30s
      multiplier: 2
      max-backoff: 30m
