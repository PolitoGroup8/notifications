# Profile used by the tests (@ActiveProfiles("test")).
# It replaces the default "local" profile, so application-local.yaml and the .env
# variables are not read: database and broker come from TestcontainersConfiguration.

spring:
  rabbitmq:
    listener:
      simple:
        retry:
          # Same behaviour as in application.yaml, but faster, so the tests do not wait.
          initial-interval: 100ms
          multiplier: 1
